name: Build and push Docker images

on:
  push:
    branches:
      - prod

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to forgejo.stabrise.com
        uses: docker/login-action@v3
        with:
          registry: forgejo.stabrise.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The docker-container driver (buildx's default) pushes each layer as
      # one monolithic PUT via containerd's registry client, which trips
      # forgejo.stabrise.com's proxy body-size limit (413) on large layers.
      # The docker driver instead pushes through the local Docker daemon's
      # classic registry client, which chunks uploads — at the cost of no
      # cache-to: type=gha support (dropped below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: forgejo.stabrise.com/${{ secrets.REGISTRY_USERNAME }}/school-ahead-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to forgejo.stabrise.com
        uses: docker/login-action@v3
        with:
          registry: forgejo.stabrise.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: forgejo.stabrise.com/${{ secrets.REGISTRY_USERNAME }}/school-ahead-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
