name: Build and push Docker images

on:
  push:
    branches:
      - prod

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to forgejo.stabrise.com
        uses: docker/login-action@v3
        with:
          registry: forgejo.stabrise.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The docker-container driver (buildx's default) pushes each layer as
      # one monolithic PUT via containerd's registry client, which trips
      # forgejo.stabrise.com's proxy body-size limit (413) on large layers.
      # The docker driver instead pushes through the local Docker daemon's
      # classic registry client, which chunks uploads — at the cost of no
      # cache-to: type=gha support (dropped below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: forgejo.stabrise.com/${{ secrets.REGISTRY_USERNAME }}/school-ahead-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    runs-on: ubuntu-latest
    # frontend/lib/api/{browser,server,zod} are Orval-generated from Django's
    # OpenAPI schema and deliberately gitignored (not committed) — see
    # frontend/orval.config.ts and docs/architecture/06-frontend-architecture.md.
    # They must exist in the build context before `docker build`, so this job
    # runs a throwaway Django+Postgres instance just to generate them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_ahead
          POSTGRES_USER: school_ahead
          POSTGRES_PASSWORD: school_ahead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_ahead"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://school_ahead:school_ahead@localhost:5432/school_ahead
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The post-job "uv cache prune" step is flaky in CI (see
          # astral-sh/setup-uv#588) and isn't needed — this job's cache
          # doesn't need trimming, it just needs to save/restore.
          prune-cache: false

      - name: Install backend dependencies
        run: uv sync

      - name: Run backend migrations
        run: uv run backend/manage.py migrate --noinput

      - name: Start backend (for schema generation only)
        run: |
          uv run backend/manage.py runserver 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/openapi.json -o /dev/null && exit 0
            sleep 1
          done
          echo "Backend never became ready" >&2
          exit 1

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Generate Orval API client
        working-directory: frontend
        env:
          OPENAPI_SCHEMA_URL: http://localhost:8000/api/openapi.json
        run: bun run orval:generate

      - name: Log in to forgejo.stabrise.com
        uses: docker/login-action@v3
        with:
          registry: forgejo.stabrise.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: forgejo.stabrise.com/${{ secrets.REGISTRY_USERNAME }}/school-ahead-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
