name: Build and push backup image

on:
  workflow_dispatch: {}

jobs:
  build-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to forgejo.stabrise.com
        uses: docker/login-action@v3
        with:
          registry: forgejo.stabrise.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # See docker-build-push.yml for why the docker driver (not the
      # docker-container default) is needed against forgejo.stabrise.com.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: forgejo.stabrise.com/${{ secrets.REGISTRY_USERNAME }}/school-ahead-backup
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile.backup
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
